<!doctype html><html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'><title>BLINDSPOT CI</title>
<style>
body{font:16px/1.5 system-ui;max-width:900px;margin:40px auto;padding:0 20px;color:#17202a}
button{padding:10px 16px;background:#1769aa;color:#fff;border:0;border-radius:6px;cursor:pointer}
pre{background:#f4f6f7;padding:16px;overflow:auto;font-size:13px}
.note{background:#fef9e7;border-left:4px solid #d4ac0d;padding:10px 14px;margin:16px 0}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;margin:3px}
.miss{background:#fadbd8}.fa{background:#fdebd0}.ok{background:#d5f5e3}
table{border-collapse:collapse;margin:12px 0}td,th{border:1px solid #d5d8dc;padding:6px 10px;text-align:left}
</style></head><body>
<h1>BLINDSPOT CI</h1>
<p>Multi-object probe demo. <a href='/'>Back to the red-tag experiment</a></p>
<div class='note'><strong>Limitation:</strong> this finds tested mismatches in a small, bounded
scenario set. It is not a safety proof and not a benchmark.</div>
<label>Scenario <select id='scenario'></select></label>
<button id='go'>Run deterministic demo</button>
<p id='state'></p><div id='summary'></div><div id='reasons'></div><div id='probes'></div>
<details><summary>Raw report</summary><pre id='out'></pre></details>
<script>
const $=id=>document.getElementById(id);
function tag(cls,text){const s=document.createElement('span');s.className='tag '+cls;s.textContent=text;return s}
async function init(){
  const r=await fetch('/api/scenarios');const list=await r.json();
  for(const id of list){const o=document.createElement('option');o.value=id;o.textContent=id;$('scenario').appendChild(o)}
}
async function run(){
  $('state').textContent='Running...';
  const r=await fetch('/api/run',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({scenario_id:$('scenario').value})});
  const d=await r.json();
  if(!r.ok){$('state').textContent='Error: '+(d.detail||r.status);return}
  $('state').textContent='Status: '+d.status+' | planner: '+d.planner+' | calls: '+d.calls+' | cost: $'+d.estimated_cost_usd.toFixed(4);
  const sum=$('summary');sum.replaceChildren();
  for(const x of d.evaluation.blind_spots)sum.appendChild(tag('miss','blind spot: '+x.label+' (severity '+x.severity+')'));
  for(const x of d.evaluation.false_positives)sum.appendChild(tag('fa','false alarm: '+x.label));
  if(!sum.children.length)sum.appendChild(tag('ok','no tested mismatch'));
  const why=$('reasons');why.replaceChildren();
  if(d.review_reasons.length){const ul=document.createElement('ul');
    for(const t of d.review_reasons){const li=document.createElement('li');li.textContent=t;ul.appendChild(li)}
    why.appendChild(ul)}
  const t=document.createElement('table');
  const head=t.insertRow();for(const h of ['Probe','Found','Confidence','Cache'])head.insertCell().outerHTML='<th>'+h+'</th>';
  d.results.forEach((res,i)=>{const row=t.insertRow();const det=res.detections[0];
    row.insertCell().textContent=d.probes[i];row.insertCell().textContent=det?'yes':'no';
    row.insertCell().textContent=det?(det.confidence===null?'not given':det.confidence):'-';row.insertCell().textContent=res.cache_hit?'hit':'miss'});
  $('probes').replaceChildren(t);
  $('out').textContent=JSON.stringify(d,null,2);
}
$('go').addEventListener('click',run);init();
</script></body></html>
