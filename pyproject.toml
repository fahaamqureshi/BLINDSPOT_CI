[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot-ci"
version = "0.1.0"
description = "Agent-enabled vision-model evaluation with human references, Python scoring, and reviewable evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pillow>=13,<14",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
live = ["meta-sam-parser>=0.1,<0.2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "meta-sam-parser>=0.1,<0.2"]

[project.scripts]
blindspot = "blindspot_ci.cli:main"

[project.urls]
Repository = "https://github.com/fahaamqureshi/BLINDSPOT_CI"
Documentation = "https://github.com/fahaamqureshi/BLINDSPOT_CI/blob/main/docs/README.md"
Issues = "https://github.com/fahaamqureshi/BLINDSPOT_CI/issues"

[tool.setuptools.packages.find]
include = ["blindspot_ci*"]

[tool.setuptools.package-data]
blindspot_ci = ["web/*.html", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
